<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CONQUER — claim the places you've been</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="crest">&#9873;</span>
      <h1>CONQUER</h1>
      <p class="auth-tagline">Claim every place you've stood on.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log in</button>
      <button class="auth-tab" data-tab="register">Create account</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Username
        <input type="text" id="login-username" autocomplete="username" required />
      </label>
      <label>Password
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn-primary">Log in</button>
      <p class="auth-error" id="login-error"></p>
    </form>

    <form id="register-form" class="auth-form hidden">
      <label>Username
        <input type="text" id="register-username" autocomplete="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" title="Letters, numbers, underscore only" />
      </label>
      <label>Password
        <input type="password" id="register-password" autocomplete="new-password" required minlength="8" />
      </label>
      <button type="submit" class="btn-primary">Create account</button>
      <p class="auth-error" id="register-error"></p>
    </form>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app-shell" class="app-shell hidden">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <span class="crest small">&#9873;</span>
      <h1>CONQUER</h1>
    </div>

    <div class="scoreboard">
      <div class="score-item">
        <span class="score-num" id="stat-countries">0</span>
        <span class="score-label">Countries</span>
      </div>
      <div class="score-item">
        <span class="score-num" id="stat-cities">0</span>
        <span class="score-label">Cities</span>
      </div>
    </div>

    <button id="reset-view-btn" class="btn-ghost small full-width">&#127760; View whole world</button>

    <section class="panel-section">
      <h2>Search</h2>
      <form id="search-form" class="inline-form">
        <input type="text" id="search-input" placeholder="city or country" />
        <button type="submit" class="btn-secondary small">Go</button>
      </form>
      <ul id="search-results" class="search-results hidden"></ul>
    </section>

    <section class="panel-section">
      <h2>Mark a place</h2>
      <p class="hint">Click anywhere on the map to claim it. Click a gold country to zoom into what you've already claimed there.</p>
      <div id="pending-pin" class="pending-pin hidden">
        <p class="pending-pin-label" id="pending-pin-label">—</p>
        <label class="pin-field-label">Note (optional)
          <input type="text" id="pin-note" placeholder="e.g. layover, road trip" maxlength="255" />
        </label>
        <label class="pin-field-label">Date visited
          <input type="date" id="pin-date" />
        </label>
        <label class="pin-field-label">Trip name (optional)
          <input type="text" id="pin-trip-name" placeholder="e.g. Japan 2024" maxlength="255" />
        </label>
        <label class="pin-field-label">Photos (optional)
          <input type="file" id="pin-photo" accept="image/*" multiple />
        </label>
        <div class="pending-pin-actions">
          <button id="confirm-pin-btn" class="btn-primary small">Claim it</button>
          <button id="cancel-pin-btn" class="btn-ghost small">Cancel</button>
        </div>
      </div>
    </section>

    <section class="panel-section">
      <h2>Achievements</h2>
      <div id="achievements-grid" class="achievements-grid"></div>
    </section>

    <section class="panel-section scroll-section">
      <h2>Your territory</h2>
      <div id="country-chips" class="country-chips"></div>
      <ul id="own-locations-list" class="location-list"></ul>
    </section>

    <section class="panel-section scroll-section">
      <h2>Allies</h2>
      <form id="add-friend-form" class="inline-form">
        <input type="text" id="friend-username-input" placeholder="username" required />
        <button type="submit" class="btn-secondary small">Add</button>
      </form>
      <p class="form-note" id="friend-request-note"></p>

      <div id="pending-requests" class="pending-requests"></div>

      <ul id="friends-list" class="friends-list"></ul>
    </section>

    <section class="panel-section scroll-section">
      <h2>Leaderboard</h2>
      <ul id="leaderboard-list" class="leaderboard-list"></ul>
    </section>

    <div class="sidebar-footer">
      <span id="current-username"></span>
      <button id="logout-btn" class="btn-ghost small">Log out</button>
    </div>

  </aside>

  <main class="map-area">
    <div id="map"></div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
